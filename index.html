<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Chroniques d'Arkanis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;touch-action:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a12;color:#c8b888;font-family:'Courier New',monospace;z-index:999}
#loading h1{font-size:18px;letter-spacing:4px;margin-bottom:20px}
#loading .bar{width:200px;height:3px;background:#1a1a2e;border-radius:2px;overflow:hidden}
#loading .fill{width:0%;height:100%;background:linear-gradient(90deg,#c8b888,#e8d8a8);transition:width .3s}
</style>
</head>
<body>
<div id="loading">
  <h1>CHRONIQUES D'ARKANIS</h1>
  <div class="bar"><div class="fill" id="loadbar"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="js/config.js"></script>
<script src="js/data/story.js"></script>
<script src="js/systems/player.js"></script>
<script src="js/systems/alchemy.js"></script>
<script src="js/scenes/BootScene.js"></script>
<script src="js/scenes/WorldScene.js"></script>
<script src="js/scenes/CombatScene.js"></script>
<script src="js/scenes/DialogScene.js"></script>
<script src="js/main.js"></script>
</body>
</html>
